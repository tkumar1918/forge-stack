services:
  postgres:
    image: postgres:18-alpine
    container_name: forge-postgres
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - forge-pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory only.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: forge-redis
    # Redis holds only derived state (queues, leases, caches). Losing it must cost
    # latency, not correctness, so no persistence is configured here on purpose.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forge-pgdata:

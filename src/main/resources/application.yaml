spring:
  application:
    name: ForgeStack

  ai:
    openai:
      # Nothing calls a model yet — ModelRouter arrives in Phase 4. But Spring AI's
      # autoconfiguration builds its client beans eagerly and refuses to start without a
      # credential, so the app could not boot at all without this. A placeholder keeps
      # startup honest: the first real call fails loudly rather than silently succeeding
      # against someone else's key.
      api-key: ${FORGESTACK_OPENAI_API_KEY:not-configured}

  datasource:
    # The application connects as forgestack_app: no superuser, no BYPASSRLS, not the table
    # owner. Row-level security is the backstop for tenant isolation, so the app must
    # not be able to escape it.
    url: jdbc:postgresql://localhost:5432/forgestack
    username: forgestack_app
    password: forgestack_app
    hikari:
      maximum-pool-size: 10
      pool-name: forgestack-pool

  flyway:
    enabled: true
    # Migrations run as the schema owner, which the application deliberately is not.
    url: jdbc:postgresql://localhost:5432/forgestack
    user: forgestack_migrator
    password: forgestack_migrator
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate validates against it and never mutates it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379

  modulith:
    events:
      # The outbox is a work list, not a history. A completed publication has been delivered and
      # the durable record of what it did lives in task_state_transitions and audit_events, so
      # keeping the row would grow the table forever to preserve a duplicate of something else.
      # Deleting also keeps the "how far behind is the relay" query scanning only real backlog.
      completion-mode: delete
      # The whole reason the outbox exists. A crash between commit and relay leaves an incomplete
      # row; without this, that row is never looked at again and the work is silently lost — which
      # is the exact failure the outbox was introduced to remove.
      republish-outstanding-events-on-restart: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${FORGESTACK_GITHUB_OAUTH_CLIENT_ID:not-configured}
            client-secret: ${FORGESTACK_GITHUB_OAUTH_CLIENT_SECRET:not-configured}
            # Login identifies a human. It grants the agent nothing.
            #
            # Deliberately NOT 'repo'. Access to a repository comes only from explicitly
            # installing the GitHub App and choosing repositories, which is a separate,
            # revocable decision. Adding 'repo' here would silently make every login a grant
            # of read/write access to everything the user can see.
            scope:
              - read:user
              - user:email

  threads:
    virtual:
      enabled: true

forgestack:
  # Which responsibilities this process takes on. One artifact, three roles, so the API
  # and the agent workers scale and fail independently. "all" is for local development.
  role: all

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    dev.tushar.forgestack: DEBUG
